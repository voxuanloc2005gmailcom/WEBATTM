# TechGear custom pre-CRS rules.
# Scanner User-Agent blocking is intentionally implemented in ModSecurity
# so the 403 also appears in the ModSecurity JSON audit log.
SecRule REQUEST_HEADERS:User-Agent "@rx (?i:(?:sqlmap|nikto|nmap|acunetix|nessus|masscan))" \
    "id:1001001,phase:1,deny,status:403,log,auditlog,msg:'TechGear scanner User-Agent blocked'"
